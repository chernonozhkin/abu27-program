      note: String(c.note || "").slice(0,400),
      buffer: !!c.buffer
    };
  });
}
function readFallback(){
  try { return sanitize(JSON.parse(document.getElementById("fallback").textContent).cards) || []; } catch(e){ return []; }
}
function store(kind, key, val){ try { const s = kind === "local" ? localStorage : sessionStorage; if (val == null) s.removeItem(key); else s.setItem(key, val); } catch(e){} }
function load(kind, key){ try { return (kind === "local" ? localStorage : sessionStorage).getItem(key); } catch(e){ return null; } }

function layoutDay(list){
  const items = list.map(c => ({c, s:c.start - (c.buffer ? SNAP : 0), e:c.start + c.dur})).sort((a,b) => a.s - b.s || b.e - a.e);
  const res = {}; let cluster = [], end = -1;
  const flush = () => {
    const lanes = [];
    cluster.forEach(it => { let l = lanes.findIndex(x => x <= it.s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = it.e; it.lane = l; });
    cluster.forEach(it => { res[it.c.id] = {lane: it.lane, lanes: lanes.length}; });
    cluster = [];
  };
  items.forEach(it => { if (cluster.length && it.s >= end) { flush(); end = -1; } cluster.push(it); end = Math.max(end, it.e); });
  if (cluster.length) flush();
  return res;
}
function kmNum(v){ const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; }
function programText(cards){
  return DAYS.map((d,i) => {
    const list = cards.filter(c => c.day === i).sort((a,b) => a.start - b.start);
    if (!list.length) return null;
    const head = d[2].charAt(0).toUpperCase() + d[2].slice(1);
    return head + "\n" + list.map(c => {
      const parts = [c.title || TYPES[c.type].label];
      if (c.km) parts.push(c.km + " км");
      if (c.place) parts.push(c.place);
      let s = fmt(c.start) + "–" + fmt(c.start + c.dur) + " " + parts.join(", ");
      if (c.note) s += ". " + c.note;
      if (c.buffer) s += " (сбор у отеля в " + fmt(c.start - SNAP) + ")";
      return s;
    }).join("\n");
  }).filter(Boolean).join("\n\n");
}

function App(){
  const [cards, setCards] = useState(null);
  const [loadNote, setLoadNote] = useState("");
  const [past, setPast] = useState([]);
  const [sel, setSel] = useState(null);
  const [drag, setDrag] = useState(null);
  const [ghost, setGhost] = useState(null);
  const [addType, setAddType] = useState(null);
  const [dirty, setDirty] = useState(false);
  const [status, setStatus] = useState("idle");
  const [restore, setRestore] = useState(null);
  const [modal, setModal] = useState(null);
  const [canSave, setCanSave] = useState(null);
  const colRefs = useRef([]);
  const cardsRef = useRef(null); cardsRef.current = cards;
  const artRef = useRef(null);
  const taRef = useRef(null);

  useEffect(() => {
    let alive = true;
    fetch(DATA_PATH, {cache:"no-store"}).then(r => { if (!r.ok) throw new Error("http"); return r.json(); })
      .then(d => { const cs = sanitize(d && d.cards); if (!cs) throw new Error("bad"); if (alive) init(cs); })
      .catch(() => { if (alive) { init(readFallback()); setLoadNote("Не удалось загрузить сохранённую версию, показываю исходный черновик."); } });
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("artifact").then(a => { if (!alive) return; artRef.current = a; setCanSave(!!a); }).catch(() => alive && setCanSave(false));
    } else setCanSave(false);
    return () => { alive = false; };
  }, []);

  function init(cs){
    setCards(cs);
    const base = JSON.stringify(cs);
    const pend = load("session", PENDING_KEY) || load("local", UNSAVED_KEY);
    if (pend) {
      try { const p = sanitize(JSON.parse(pend)); if (p && JSON.stringify(p) !== base) setRestore(p); else { store("session", PENDING_KEY, null); store("local", UNSAVED_KEY, null); } } catch(e){}
    }
  }

  useEffect(() => { if (cards && dirty) store("local", UNSAVED_KEY, JSON.stringify(cards)); }, [cards, dirty]);

  const commit = useCallback((next, hist = true) => {
    if (hist) setPast(p => [...p.slice(-49), cardsRef.current]);
    setCards(next); setDirty(true);
    setStatus(s => (s === "saved" ? "idle" : s));
  }, []);
  const update = (id, patch, hist = false) => commit(cardsRef.current.map(c => c.id === id ? {...c, ...patch} : c), hist);
  const remove = id => { commit(cardsRef.current.filter(c => c.id !== id)); setSel(null); };
  const duplicate = id => {
    const c = cardsRef.current.find(x => x.id === id); if (!c) return;
    const copy = {...c, id: uid(), day: Math.min(c.day + 1, DAYS.length - 1)};
    commit([...cardsRef.current, copy]); setSel(copy.id);
  };
  const pastRef = useRef([]); pastRef.current = past;
  const undo = () => {
    const p = pastRef.current; if (!p.length) return;
    const prev = p[p.length - 1];
    setPast(p.slice(0, -1)); setCards(prev); setDirty(true); setStatus(s => (s === "saved" ? "idle" : s));
  };

  useEffect(() => {
    const onKey = e => {
      const tag = (e.target && e.target.tagName) || "";
      const typing = /INPUT|TEXTAREA|SELECT/.test(tag);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); }
      else if (e.key === "Escape") { setSel(null); setAddType(null); setModal(null); }
      else if ((e.key === "Delete" || e.key === "Backspace") && sel && !typing) { e.preventDefault(); remove(sel); }
    };
    window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey);
  }, [sel]);

  function colIndexAt(x, y, needY){
    const rects = colRefs.current.map(el => el ? el.getBoundingClientRect() : null);
    const i = rects.findIndex(r => r && x >= r.left && x < r.right && (!needY || (y >= r.top && y < r.bottom)));
    return {i, rects};
  }

  function startCardDrag(e, card, mode){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const st = {x:e.clientX, y:e.clientY, moved:false, cur:{day:card.day, start:card.start, dur:card.dur}};
    const onMove = ev => {
      const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
      if (!st.moved && Math.hypot(dx, dy) < 4) return;
      st.moved = true;
      if (mode === "move") {
        const minStart = START + (card.buffer ? SNAP : 0);
        const start = clamp(card.start + snap(dy / PPM), minStart, END - card.dur);
        const {i} = colIndexAt(ev.clientX, ev.clientY, false);
        st.cur = {day: i >= 0 ? i : st.cur.day, start, dur: card.dur};
      } else {
        const dur = clamp(snap(card.dur + dy / PPM), SNAP, END - card.start);
        st.cur = {day: card.day, start: card.start, dur};
      }
      setDrag({id: card.id, ...st.cur});
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onUp);
      setDrag(null);
      if (st.moved) {
        const c = st.cur;
        if (c.day !== card.day || c.start !== card.start || c.dur !== card.dur) update(card.id, c, true);
      } else if (mode === "move") setSel(card.id);
    };
    window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", onUp); window.addEventListener("pointercancel", onUp);
  }

  function createAt(type, day, offsetY){
    const T = TYPES[type];
    const buffer = T.training;
    const start = clamp(snap(START + offsetY / PPM), START + (buffer ? SNAP : 0), END - T.dur);
    const c = {id: uid(), day, start, dur: T.dur, type, title: T.title, place: "", km: "", note: "", buffer};
    commit([...cardsRef.current, c]); setSel(c.id); setAddType(null);
  }

  function startChipDrag(e, type){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const st = {x:e.clientX, y:e.clientY, moved:false};
    const onMove = ev => {
      if (!st.moved && Math.hypot(ev.clientX - st.x, ev.clientY - st.y) < 4) return;
      st.moved = true; setGhost({type, x: ev.clientX, y: ev.clientY});
    };
    const onUp = ev => {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onUp);
      setGhost(null);
      if (!st.moved) { setAddType(t => t === type ? null : type); setSel(null); return; }
      const {i, rects} = colIndexAt(ev.clientX, ev.clientY, true);
      if (i >= 0) createAt(type, i, ev.clientY - rects[i].top);
    };
    window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", onUp); window.addEventListener("pointercancel", onUp);
  }

  async function save(){
    const a = artRef.current;
    if (!a) { setStatus("readonly"); return; }
    setStatus("saving");
    const data = {version:1, updated:new Date().toISOString(), cards: cardsRef.current};
    const body = JSON.stringify(data, null, 1);
    store("session", PENDING_KEY, JSON.stringify(cardsRef.current));
    const attempt = () => a.publish({[DATA_PATH]: {content: body, contentType: "application/json"}});
    try {
      try { await attempt(); }
      catch (e) { if (e && e.code === "upstream_error") { await new Promise(r => setTimeout(r, 900 + Math.random() * 900)); await attempt(); } else throw e; }
      setDirty(false); setStatus("saved"); store("session", PENDING_KEY, null); store("local", UNSAVED_KEY, null);
    } catch (e) {
      const code = e && e.code;
      if (code === "conflict") setStatus("conflict");
      else if (["not_writer","not_granted","capability_disabled","consent_required","not_declared","capability_removed"].includes(code)) { setStatus("readonly"); setCanSave(false); store("session", PENDING_KEY, null); }
      else if (code === "rate_limited") setStatus("rate");
      else setStatus("error");
    }
  }

  async function copyText(text){
    try { await navigator.clipboard.writeText(text); return true; } catch(e){ return false; }
  }
  function openModal(kind){
    const text = kind === "text" ? programText(cardsRef.current) : kind === "json" ? JSON.stringify({version:1, cards: cardsRef.current}) : "";
    setModal({kind, text, note:""});
  }
  async function modalCopy(){
    const ok = await copyText(modal.text);
    if (ok) setModal(m => ({...m, note:"Скопировано."}));
    else { if (taRef.current) { taRef.current.focus(); taRef.current.select(); } setModal(m => ({...m, note:"Текст выделен, нажмите Ctrl+C (или «Копировать» в меню)."})); }
  }
  function modalImport(){
    try {
      const raw = JSON.parse(modal.text);
      const cs = sanitize(Array.isArray(raw) ? raw : raw && raw.cards);
      if (!cs || !cs.length) throw new Error("empty");
      commit(cs); setModal(null); setSel(null);
    } catch(e){ setModal(m => ({...m, note:"Не получилось прочитать программу. Вставьте текст целиком, как его прислал Александр."})); }
  }

  const eff = useMemo(() => !cards ? [] : cards.map(c => drag && c.id === drag.id ? {...c, day: drag.day, start: drag.start, dur: drag.dur} : c), [cards, drag]);
  const byDay = useMemo(() => DAYS.map((_, i) => eff.filter(c => c.day === i)), [eff]);
  const layouts = useMemo(() => byDay.map(layoutDay), [byDay]);
  const totals = useMemo(() => {
    const keys = ["swim","bike","run","ofp","other"];
    const t = {}; keys.forEach(k => { t[k] = {n:0, min:0, km:0}; });
    (cards || []).forEach(c => { const r = t[c.type]; if (!r) return; r.n++; r.min += c.dur; r.km += kmNum(c.km); });
    const all = {n:0, min:0, km:0};
    keys.forEach(k => { all.n += t[k].n; all.min += t[k].min; all.km += t[k].km; });
    return {rows: keys.map(k => ({k, ...t[k]})), all};
  }, [cards]);

  if (!cards) return html`<div className="wrap"><h1>Программа Абу-Даби 2027</h1><p className="loading">Загружаю программу…</p></div>`;

  const selCard = cards.find(c => c.id === sel) || null;
  const statusChip = status === "saving" ? html`<span className="status">Сохраняю…</span>`
    : dirty ? html`<span className="status dirty">Есть несохранённые изменения</span>`
    : status === "saved" ? html`<span className="status ok">Сохранено</span>`
    : html`<span className="status">Сохранённая версия</span>`;
  const hrs = m => m ? (m / 60).toLocaleString("ru-RU", {maximumFractionDigits:1}) : "—";
  const kmf = v => v ? v.toLocaleString("ru-RU", {maximumFractionDigits:1}) : "—";

  return html`<div className="wrap">
    <div className="top">
      <div>
        <h1>Программа Абу-Даби 2027</h1>
        <p className="sub">Сборы 19–27 февраля 2027 · черновик для Александра · вело стартует в 08:00, завтрак общий 06:00–07:00</p>
      </div>
      <div className="actions">
        ${statusChip}
        <button className="ghost" onClick=${undo} disabled=${!past.length} title="Ctrl+Z">Отменить</button>
        <button onClick=${() => openModal("text")}>Текст программы</button>
        <button onClick=${() => openModal("json")}>Скопировать для Семёна</button>
        <button className="ghost" onClick=${() => setModal({kind:"import", text:"", note:""})}>Вставить присланное</button>
        <button className="primary" onClick=${save} disabled=${!dirty || status === "saving" || canSave === false}>Сохранить</button>
      </div>
    </div>

    ${loadNote && html`<div className="banner"><p>${loadNote}</p></div>`}
    ${restore && html`<div className="banner"><p>Есть несохранённые изменения с прошлого раза. Вернуть их?</p>
      <button onClick=${() => { setPast(p => [...p, cardsRef.current]); setCards(restore); setDirty(true); setRestore(null); }}>Вернуть</button>
      <button className="ghost" onClick=${() => { setRestore(null); store("session", PENDING_KEY, null); store("local", UNSAVED_KEY, null); }}>Не нужно</button></div>`}
    ${(status === "readonly" || canSave === false) && html`<div className="banner"><p>Из этого окна сохранять нельзя: нет прав на изменение страницы. Двигайте карточки как обычно, а в конце нажмите «Скопировать для Семёна» и пришлите текст Семёну в Telegram. Он загрузит программу у себя.</p></div>`}
    ${status === "conflict" && html`<div className="banner"><p>Кто-то сохранил программу раньше вас. Страница сейчас обновится, ваши изменения можно будет вернуть кнопкой «Вернуть».</p></div>`}
    ${status === "rate" && html`<div className="banner"><p>Слишком частые сохранения. Подождите минуту и нажмите «Сохранить» ещё раз.</p></div>`}
    ${status === "error" && html`<div className="banner"><p>Сохранить не получилось. Попробуйте ещё раз через минуту или нажмите «Скопировать для Семёна».</p></div>`}

    <details className="help" open>
      <summary>Как пользоваться</summary>
      <ol>
        <li>Карточку можно перетащить на другой день или время. Нижний край тянется, так меняется длительность. Шаг 15 минут.</li>
        <li>Нажмите на карточку, чтобы поменять тип, название, место, километраж и задание. Там же копия и удаление.</li>
        <li>Новая тренировка: перетащите тип из строки ниже в нужное место календаря или нажмите на тип, а потом на ячейку.</li>
        <li>Буфер ответственности 15 минут (сбор группы у отеля) встаёт сам перед каждой тренировкой. Его можно выключить в карточке.</li>
        <li>От Александра нужны объёмы и километраж по дням, интервальные работы и место для ОФП.</li>
        <li>Когда закончите, нажмите «Сохранить». Если кнопка неактивна, нажмите «Скопировать для Семёна» и пришлите ему текст.</li>
      </ol>
    </details>

    <div className="bar">
      <div className="palette" role="toolbar" aria-label="Типы карточек">
        ${TYPE_ORDER.map(t => html`<button key=${t} className=${"chip t-" + t + (addType === t ? " on" : "")}
            onPointerDown=${e => startChipDrag(e, t)} onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setAddType(x => x === t ? null : t); } }}
            aria-pressed=${addType === t}>${TYPES[t].label}</button>`)}
      </div>
    </div>
    ${addType && html`<p className="hint">Нажмите в календаре, куда поставить «${TYPES[addType].label}». Esc — отмена.</p>`}

    <div className="main">
    <div className="scroller">
      <div className="grid" style=${{"--grid-h": (END - START) * PPM + "px", "--hour": HOUR + "px"}}>
        <div className="corner"></div>
        ${DAYS.map((d, i) => html`<div key=${"h" + i} className="dayhead"><span className="dw">${d[1]}</span><span className="dd">${d[0]}.2027</span></div>`)}
        <div className="times" aria-hidden="true">
          ${Array.from({length: (END - START) / 60}, (_, k) => html`<span key=${k} style=${{top: k * HOUR + "px"}}>${fmt(START + k * 60)}</span>`)}
        </div>
        ${DAYS.map((d, i) => html`<div key=${"c" + i} ref=${el => { colRefs.current[i] = el; }}
            className=${"colbody" + (addType ? " adding" : "")}
            onPointerDown=${e => { if (e.target !== e.currentTarget) return; if (addType) { const r = e.currentTarget.getBoundingClientRect(); createAt(addType, i, e.clientY - r.top); } else setSel(null); }}>
          ${byDay[i].map(c => {
            const lay = layouts[i][c.id] || {lane:0, lanes:1};
            const T = TYPES[c.type] || TYPES.other;
            const buf = c.buffer ? SNAP : 0;
            const top = (c.start - buf - START) * PPM, h = (c.dur + buf) * PPM, w = 100 / lay.lanes;
            const short = c.dur <= 30;
            const meta = [c.km ? c.km + " км" : "", c.place].filter(Boolean).join(" · ");
            return html`<div key=${c.id} tabIndex="0" role="button" title=${[c.title || T.label, meta, c.note].filter(Boolean).join(" · ")}
                aria-label=${(c.title || T.label) + ", " + d[2] + ", " + fmt(c.start) + "–" + fmt(c.start + c.dur)}
                className=${"card t-" + c.type + (sel === c.id ? " sel" : "") + (drag && drag.id === c.id ? " dragging" : "") + (short ? " short" : "")}
                style=${{top: top + "px", height: h + "px", left: "calc(" + (lay.lane * w) + "% + 2px)", width: "calc(" + w + "% - 4px)"}}
                onPointerDown=${e => startCardDrag(e, c, "move")}
                onKeyDown=${e => { if (e.key === "Enter") setSel(c.id); }}>
              ${c.buffer && html`<div className="buf" style=${{height: buf * PPM + "px"}}>сбор ${fmt(c.start - SNAP)}</div>`}
              <div className="cbody">
                <span className="ctime">${fmt(c.start)}–${fmt(c.start + c.dur)}</span>
                <span className="ctitle">${c.title || T.label}</span>
                ${c.dur > 60 && meta && html`<span className="cmeta">${meta}</span>`}
                ${!short && c.note && c.dur >= 75 && html`<span className="cnote">${c.note}</span>`}
              </div>
              <div className="rz" onPointerDown=${e => startCardDrag(e, c, "resize")}></div>
            </div>`;
          })}
        </div>`)}
      </div>
    </div>
    <aside className="sum" aria-label="Итого по видам" aria-live="polite">
      <h2>Итого за сборы</h2>
      <table>
        <thead><tr><th scope="col">Вид</th><th scope="col">Трен.</th><th scope="col">Часы</th><th scope="col">Км</th></tr></thead>
        <tbody>
          ${totals.rows.map(r => html`<tr key=${r.k}><th scope="row"><span className=${"sw t-" + r.k}></span>${TYPES[r.k].label}</th><td>${r.n || "—"}</td><td>${hrs(r.min)}</td><td>${kmf(r.km)}</td></tr>`)}
        </tbody>
        <tfoot><tr><th scope="row">Всего</th><td>${totals.all.n}</td><td>${hrs(totals.all.min)}</td><td>${kmf(totals.all.km)}</td></tr></tfoot>
      </table>
      <p className="muted small">Часы считаются по длине карточек без буфера, километры берутся из поля «Дистанция» в карточке.</p>
    </aside>
    </div>

    ${ghost && html`<div className=${"chip drag-ghost t-" + ghost.type} style=${{left: ghost.x + "px", top: ghost.y + "px"}}>${TYPES[ghost.type].label}</div>`}

    ${selCard && html`<${Editor} card=${selCard} onChange=${(p, h) => update(selCard.id, p, h)} onClose=${() => setSel(null)}
        onDelete=${() => remove(selCard.id)} onDuplicate=${() => duplicate(selCard.id)} />`}

    ${modal && html`<div className="modal-bg" onPointerDown=${e => { if (e.target === e.currentTarget) setModal(null); }}>
      <div className="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
        <h2 id="mtitle">${modal.kind === "text" ? "Текст программы" : modal.kind === "json" ? "Программа для Семёна" : "Вставить программу от Александра"}</h2>
        <p className="muted" style=${{margin:0}}>${modal.kind === "text" ? "По дням, со временем, местом и километражем. Подходит для поста и для переписки."
          : modal.kind === "json" ? "Скопируйте этот текст целиком и пришлите Семёну. Он вставит его у себя кнопкой «Вставить присланное»."
          : "Вставьте сюда текст, который прислал Александр, и нажмите «Загрузить». Потом «Сохранить»."}</p>
        <textarea id="mtext" ref=${taRef} readOnly=${modal.kind !== "import"} value=${modal.text}
          onChange=${e => setModal(m => ({...m, text: e.target.value, note:""}))}></textarea>
        ${modal.note && html`<p className="hint" style=${{margin:0}}>${modal.note}</p>`}
        <div className="actions" style=${{justifyContent:"flex-end"}}>
          <button className="ghost" onClick=${() => setModal(null)}>Закрыть</button>
          ${modal.kind === "import" ? html`<button className="primary" onClick=${modalImport}>Загрузить</button>` : html`<button className="primary" onClick=${modalCopy}>Копировать</button>`}
        </div>
      </div></div>`}
  </div>`;
}

function Editor({card, onChange, onClose, onDelete, onDuplicate}){
  const T = TYPES[card.type] || TYPES.other;
  const endOptions = TIMES.filter(m => m > card.start);
  return html`<aside className="panel" aria-label="Карточка">
    <div style=${{display:"flex", justifyContent:"space-between", alignItems:"center", gap:8}}>
      <h2>${card.title || T.label}</h2>
      <button className="ghost" onClick=${onClose} aria-label="Закрыть">Готово</button>
    </div>
    <label className="f" htmlFor="e-type">Тип
      <select id="e-type" value=${card.type} onChange=${e => { const t = e.target.value; onChange({type: t, buffer: TYPES[t].training}, true); }}>
        ${TYPE_ORDER.map(t => html`<option key=${t} value=${t}>${TYPES[t].label}</option>`)}
      </select></label>
    <label className="f" htmlFor="e-title">Название
      <input id="e-title" value=${card.title} onChange=${e => onChange({title: e.target.value})} /></label>
    <label className="f" htmlFor="e-place">Место
      <input id="e-place" value=${card.place} placeholder="Например, Al Hudayriyat Island" onChange=${e => onChange({place: e.target.value})} /></label>
    <div className="row">
      <label className="f" htmlFor="e-day">День
        <select id="e-day" value=${card.day} onChange=${e => onChange({day: Number(e.target.value)}, true)}>
          ${DAYS.map((d, i) => html`<option key=${i} value=${i}>${d[1]}, ${d[0]}</option>`)}
        </select></label>
      <label className="f" htmlFor="e-km">Дистанция, км
        <input id="e-km" inputMode="decimal" value=${card.km} placeholder=${card.type === "swim" ? "например, 2,5" : T.km ? "например, 60" : "если есть"} onChange=${e => onChange({km: e.target.value})} /></label>
    </div>
    <div className="row">
      <label className="f" htmlFor="e-start">Начало
        <select id="e-start" value=${card.start} onChange=${e => { const s = Number(e.target.value); onChange({start: s, dur: Math.min(card.dur, END - s)}, true); }}>
          ${TIMES.filter(m => m < END && m >= START + (card.buffer ? SNAP : 0)).map(m => html`<option key=${m} value=${m}>${fmt(m)}</option>`)}
        </select></label>
      <label className="f" htmlFor="e-end">Конец
        <select id="e-end" value=${card.start + card.dur} onChange=${e => onChange({dur: Number(e.target.value) - card.start}, true)}>
          ${endOptions.map(m => html`<option key=${m} value=${m}>${fmt(m)}</option>`)}
        </select></label>
    </div>
    <label className="f" htmlFor="e-note">Задание или комментарий
      <textarea id="e-note" rows="3" value=${card.note} placeholder="Например, 4 × 1 км в темпе 10 км" onChange=${e => onChange({note: e.target.value})}></textarea></label>
    <label className="chk" htmlFor="e-buf"><input id="e-buf" type="checkbox" checked=${card.buffer}
      onChange=${e => { const b = e.target.checked; onChange({buffer: b, start: b ? Math.max(card.start, START + SNAP) : card.start}, true); }} />
      Буфер 15 минут перед стартом (сбор у отеля)</label>
    <div className="btns">
      <button onClick=${onDuplicate}>Копия на следующий день</button>
      <button className="ghost" onClick=${onDelete}>Удалить</button>
    </div>
  </aside>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>

</body></html>
